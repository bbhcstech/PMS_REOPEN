<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1754" width="1240" height="1754">
  <defs>
    <!-- Gradients matching Picture 2 -->
    <linearGradient id="headerRibbon1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    
    <linearGradient id="headerRibbon2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="50%" stop-color="#bfdbfe" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <linearGradient id="foldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bfdbfe" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <linearGradient id="foldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>

  <!-- Clean Crisp White Background Sheet -->
  <rect width="1240" height="1754" fill="#ffffff" />

  <!-- ================= TOP HEADER RIBBONS (Picture 2 Style) ================= -->
  <!-- Top Background Slate Bar -->
  <path d="M 0 0 L 1240 0 L 1240 70 L 670 70 L 640 140 L 0 140 Z" fill="#64748b" />

  <!-- Top CIN Bar Text -->
  <text x="1200" y="44" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="end" opacity="0.95">
    CIN : U62090WB2026PTC287230
  </text>

  <!-- Blue Angle Header Ribbon Layer 1 -->
  <polygon points="460,0 600,0 720,70 580,70" fill="url(#headerRibbon2)" opacity="0.85" />

  <!-- Blue Fold Ribbon 1 -->
  <polygon points="680,40 760,40 820,105 740,105" fill="url(#foldGradient)" />
  <polygon points="740,105 765,130 845,65 820,40" fill="url(#foldDark)" opacity="0.75" />

  <!-- Blue Fold Ribbon 2 -->
  <polygon points="790,40 870,40 930,105 850,105" fill="url(#foldGradient)" />
  <polygon points="850,105 875,130 955,65 930,40" fill="url(#foldDark)" opacity="0.75" />

  <!-- Blue Fold Ribbon 3 -->
  <polygon points="900,40 980,40 1040,105 960,105" fill="url(#foldGradient)" />
  <polygon points="960,105 985,130 1065,65 1040,40" fill="url(#foldDark)" opacity="0.75" />

  <!-- Company Logo Icon Graphic -->
  <g transform="translate(30, 20)">
    <!-- Shield / Globe Dome -->
    <path d="M 50 15 A 35 35 0 0 1 120 15 A 35 35 0 0 1 50 15 Z" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.8" />
    <path d="M 85 5 L 85 45 M 55 25 Q 85 10 115 25 M 58 35 Q 85 20 112 35" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.7" />
    
    <!-- Logo Text -->
    <text x="85" y="70" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">
      BENGAL
    </text>
    <line x1="45" y1="80" x2="125" y2="80" stroke="#ffffff" stroke-width="1.5" opacity="0.8" />
    <text x="85" y="94" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="4">
      IT HUB
    </text>
  </g>

  <!-- Company Name in Header -->
  <text x="210" y="96" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="1">
    BENGAL IT HUB PRIVATE LIMITED
  </text>


  <!-- ================= BOTTOM FOOTER RIBBONS (Picture 2 Style) ================= -->
  <!-- Bottom Slate Background -->
  <path d="M 460 1674 L 500 1600 L 1240 1600 L 1240 1754 L 0 1754 L 0 1674 Z" fill="url(#footerBg)" />

  <!-- Bottom Left Cyan / Blue Fold Ribbons -->
  <!-- Ribbon 1 -->
  <polygon points="60,1754 140,1754 200,1630 120,1630" fill="url(#foldGradient)" />
  <polygon points="120,1630 145,1605 225,1729 200,1754" fill="url(#foldDark)" opacity="0.65" />

  <!-- Ribbon 2 -->
  <polygon points="170,1754 250,1754 310,1630 230,1630" fill="url(#foldGradient)" />
  <polygon points="230,1630 255,1605 335,1729 310,1754" fill="url(#foldDark)" opacity="0.65" />

  <!-- Ribbon 3 -->
  <polygon points="280,1754 360,1754 420,1630 340,1630" fill="url(#foldGradient)" />
  <polygon points="340,1630 365,1605 445,1729 420,1754" fill="url(#foldDark)" opacity="0.65" />

  <!-- Footer Contact Info Lines -->
  <g transform="translate(1200, 1660)" text-anchor="end" font-family="'Plus Jakarta Sans', Inter, sans-serif" fill="#ffffff">
    <!-- Address Line -->
    <text x="0" y="0" font-size="20" font-weight="700" letter-spacing="0.5" opacity="0.95">
      3RD FLOOR 259, NEW SANTOSHPUR MAIN RD, SANTOSHPUR, KOLKATA 700075, INDIA
    </text>

    <!-- Phone, Web, Email Row -->
    <g transform="translate(0, 36)" font-size="18" font-weight="600" opacity="0.9">
      <!-- Phone -->
      <text x="-560" y="0">📞 +91 92306 53975</text>
      <!-- Web -->
      <text x="-260" y="0">🌐 WWW.BENGALITHUB.COM</text>
      <!-- Email -->
      <text x="0" y="0">✉ CONTACT@BENGALITHUB.COM</text>
    </g>
  </g>
</svg>
